<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>خيرات العز — لوحة العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Layout: a ledger-like workbench — quiet header, tabs as the sheet tabs of the old
   workbook, the two vans always side by side, numbers right-aligned in tabular figures. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --sunk:#eef2f0; --line:#dde4e1; --ink:#16201d; --muted:#5d6b66;
  --accent:#1d6b58; --accent-soft:#e2efea;
  --van1:#1d6b58; --van2:#a2621a; --van2-soft:#f5ebdd;
  --good:#2f7d4f; --warn:#a86a12; --bad:#b4372f; --bad-soft:#f8e5e3; --warn-soft:#f7eedb; --good-soft:#e3f1e8;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#172019; --sunk:#1c2622; --line:#2a3631; --ink:#e7eeeb; --muted:#9aaaa4;
  --accent:#5cbf9f; --accent-soft:#1d3a31; --van1:#5cbf9f; --van2:#e0a458; --van2-soft:#3a2c19;
  --good:#6fcf97; --warn:#e3b04b; --bad:#ef7a70; --bad-soft:#3b1f1c; --warn-soft:#3a2f17; --good-soft:#1c3326;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#172019; --sunk:#1c2622; --line:#2a3631; --ink:#e7eeeb; --muted:#9aaaa4;
  --accent:#5cbf9f; --accent-soft:#1d3a31; --van1:#5cbf9f; --van2:#e0a458; --van2-soft:#3a2c19;
  --good:#6fcf97; --warn:#e3b04b; --bad:#ef7a70; --bad-soft:#3b1f1c; --warn-soft:#3a2f17; --good-soft:#1c3326;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.35rem} h2{font-size:1.08rem} h3{font-size:.95rem}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:left;direction:ltr;unicode-bidi:plaintext}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;padding-bottom:14px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:.8rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=search]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:500;white-space:nowrap}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.v1{background:var(--accent-soft);color:var(--van1)} .pill.v2{background:var(--van2-soft);color:var(--van2)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
nav.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}
section.view{display:flex;flex-direction:column;gap:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel.van{border-top:3px solid var(--vc)}
.panel.unsettled{border-color:var(--warn);background:var(--warn-soft)}
.panel.unsettled table td{border-bottom-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:760px){.kpis.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.kpis,.kpis.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .value{overflow-wrap:anywhere}
.kpi .label{font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.kpi .value{font-family:var(--display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.kpi .sub{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.split{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.88rem}
.rows .num{text-align:left}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.76rem;background:var(--sunk);position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tr.sub td{background:var(--sunk);font-weight:600}
tr.total td{font-weight:600;border-top:2px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
td.neg{color:var(--bad)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.82rem;max-width:70ch}
button.ghost{font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 10px;cursor:pointer}
button.ghost:hover{color:var(--ink);border-color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.82rem;background:var(--surface);color:var(--muted);border:none;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.empty{padding:22px;color:var(--muted);text-align:center;font-size:.9rem;line-height:1.7}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:baseline;font-size:.86rem;padding:8px 12px;border-radius:8px;background:var(--warn-soft)}
.alert.bad{background:var(--bad-soft)}
.alert b{font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.note{font-size:.8rem;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){nav.tabs a,tr.click td{transition:background .15s,color .15s}}

/* editing layer */
.btn{font:inherit;font-size:.84rem;font-weight:500;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.55;cursor:wait}
.icon-btn{font:inherit;font-size:.78rem;background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:2px 7px;cursor:pointer}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad);border-color:var(--bad)}
.actions{display:inline-flex;gap:2px;white-space:nowrap}
tr.gone td{color:var(--muted);text-decoration:line-through}
tr.gone td.keep{text-decoration:none}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 38%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:20}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px color-mix(in srgb,var(--ink) 25%,transparent)}
.sheet h2{font-size:1.05rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.76rem;color:var(--muted)}
.field input,.field select,.field textarea,td input,td select{font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
td input,td select{padding:4px 6px;font-size:.86rem}
td input.n{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.field textarea{min-height:58px;resize:vertical}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.sheet-foot .grow{flex:1;min-width:120px;font-size:.85rem}
.err{color:var(--bad);font-size:.85rem;background:var(--bad-soft);border-radius:7px;padding:7px 10px}
.warn-line{color:var(--warn);font-size:.8rem}
.lines td{padding:4px 5px}
.status-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.banner{padding:14px 16px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.9rem;line-height:1.7}
.banner.bad{background:var(--bad-soft)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.set-grid{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(90px,1fr));gap:0}
.set-grid>div{padding:7px 10px;border-bottom:1px solid var(--line);font-size:.86rem;display:flex;align-items:center}
.set-grid .hd{font-size:.76rem;color:var(--muted);background:var(--sunk);font-weight:600}
.set-grid select{font:inherit;font-size:.84rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;width:100%}
.hist{font-size:.82rem}
.loading{}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;background:transparent;pointer-events:none;opacity:0;transition:opacity .25s}
#busy.on{opacity:1}
#busy::before{content:"";position:absolute;top:0;bottom:0;width:38%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent,#1d6b58),transparent);animation:busy 1.1s linear infinite}
@keyframes busy{from{left:-40%}to{left:100%}}
#status .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent,#1d6b58);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-inline-end:4px}
@keyframes spin{to{transform:rotate(360deg)}}

fieldset label.toggle input{margin-top:3px}

.cchip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.cchip::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--cc);flex:none}
tr.crow td:first-child{box-shadow:inset -4px 0 0 var(--cc)}
tr.sub.crow td{background:color-mix(in srgb, var(--cc) 9%, transparent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rcard{border-top:4px solid var(--cc)}
.rcard table.mini{width:100%;font-size:.85rem;border-collapse:collapse}
.rcard table.mini td{padding:4px 2px;border-bottom:1px solid var(--line)}
.rcard table.mini tr.total td{font-weight:700;border-bottom:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ccard{border-inline-start:4px solid var(--cc)}
.ccard .value{font-size:1.35rem;font-weight:700;margin:4px 0}
.ccard input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--surface)}
.vt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}.vt-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;border-bottom:1px dashed var(--line);padding:3px 0}.vt-row select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
tr.foot-heads th{font-weight:600;color:var(--muted);font-size:.72rem;background:var(--sunk);border-top:1px solid var(--line);border-bottom:none;position:static}
.tablebox.tall{max-height:74vh;overflow:auto}
.tablebox.tall thead th{position:sticky;top:0;z-index:2}
.tablebox.tall tr.foot-heads th{position:sticky;bottom:0;z-index:2}
.tablebox.tall tr.total.stick td{position:sticky;bottom:var(--fh,0px);z-index:2;background:var(--surface);box-shadow:0 -1px 0 var(--line)}
.tablebox.wide th:first-child,.tablebox.wide td:first-child{position:sticky;right:0;z-index:1;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
.tablebox.wide thead th:first-child,.tablebox.wide tr.foot-heads th:first-child{background:var(--sunk);z-index:3}
.tablebox.wide tr.sub td:first-child{background:var(--sunk)}
.tablebox.tall.wide tr.total.stick td:first-child{z-index:3}
tbody tr:not(.total):not(.sub):hover>td{background:var(--accent-soft)}

/* managers' page. Never: deleting, restoring, settings, vans, PINs, managers, closing a day */
html.ro .owner-strict{display:none!important}
html.ro [data-act=newVan],html.ro [data-act=maintOn],html.ro [data-act=maintOff],html.ro [data-sreceipt]~.pill,html.ro [data-act=toggleClose],
html.ro [data-act=savePreset],html.ro [data-act=delPreset],html.ro [data-act=newViewer],html.ro [data-editvan],html.ro [data-del],html.ro [data-restore],
html.ro [data-pin],html.ro [data-revoke],html.ro [data-rmphoto],html.ro [data-delbatch],html.ro [data-resbatch],html.ro [data-redit],html.ro .rc-acts,html.ro details,html.ro label:has(#showDel){display:none!important}
/* adding / editing: only on the pages the owner opened for editing (html.ed) */
html.ro:not(.ed) [data-act=newInvoice],html.ro:not(.ed) [data-act=newPurchase],html.ro:not(.ed) [data-act=newCollection],html.ro:not(.ed) [data-act=newTransfer],
html.ro:not(.ed) [data-act=newExpense],html.ro:not(.ed) [data-act=newDeposit],html.ro:not(.ed) [data-act=newCustomer],html.ro:not(.ed) [data-act=newItem],
html.ro:not(.ed) .add-on-day,html.ro:not(.ed) [data-editinv],html.ro:not(.ed) [data-editp],html.ro:not(.ed) [data-editcol],html.ro:not(.ed) [data-edittrf],
html.ro:not(.ed) [data-editcust],html.ro:not(.ed) [data-edititem],html.ro:not(.ed) [data-editexp],html.ro:not(.ed) [data-editdep],html.ro:not(.ed) [data-upload],
html.ro:not(.ed) [data-count],html.ro:not(.ed) .owner-only,html.ro:not(.ed) [data-ccolor],html.ro:not(.ed) [data-cren],html.ro:not(.ed) [data-etren],
html.ro:not(.ed) #pvAdd,html.ro:not(.ed) [data-redit],html.ro:not(.ed) [data-act=cfSaveVal],html.ro:not(.ed) [data-act=cfClearVal],html.ro:not(.ed) #cfValV,html.ro:not(.ed) #cfValN{display:none!important}
html.ro:not(.ed) select[data-kind],html.ro:not(.ed) select[data-cheque],html.ro select[data-set]{pointer-events:none;appearance:none;border-color:transparent;background:none}
#tabs a.can-edit::after{content:' ✎';font-size:.8em;opacity:.7}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#login[hidden]{display:none}
#login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand" style="flex-direction:row;align-items:center;gap:12px">
      <img id="brandLogo" alt="" width="44" height="45" style="flex:none">
      <div style="display:flex;flex-direction:column;gap:2px"><h1>خيرات العز — لوحة العرض</h1>
      <small id="subtitle">للعرض فقط · الأرقام مباشرة من قاعدة البيانات</small></div>
    </div>
    <div class="controls">
      <span class="status-bar" id="status"></span>
      <span id="who" class="muted" style="font-size:.82rem"></span><button class="btn sec" type="button" id="logoutBtn" hidden>خروج</button>
      <span id="dayBox" style="display:inline-flex;gap:6px;align-items:center">
        <button class="icon-btn" type="button" id="prevDay" aria-label="اليوم السابق">→</button>
        <input type="date" id="dayInput" aria-label="اليوم" style="font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px">
        <button class="icon-btn" type="button" id="nextDay" aria-label="اليوم التالي">←</button>
      </span>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#today">ملخص اليوم</a>
    <a href="#sheet">ورقة اليوم</a>
    <a href="#bank">الإيداع والبنك</a>
    <a href="#sales">المبيعات</a>
    <a href="#purchases">المشتريات</a>
    <a href="#stock">المخزون</a>
    <a href="#expenses">المصاريف</a>
    <a href="#docs">الصور والمستندات</a>
    <a href="#reports">التقارير</a>
    <a href="#pnl">الأرباح والخسائر</a>
    <a href="#cashflow">التدفق النقدي</a>
    <a href="#debts">العملاء والذمم</a>
    <a href="#vans">السيارات</a>
    <a href="#transfers">التحويلات والكلفة</a>
    <a href="#cheques">الشيكات</a>
    <a href="#items">الأصناف</a>
    <a href="#search">🔍 بحث</a>
  </nav>
  <main id="main"><div class="panel empty">جارٍ الاتصال بقاعدة البيانات…</div></main>
</div>
<div id="busy" aria-hidden="true"></div>
<div id="modal"></div>
<div class="toast" id="toast" dir="rtl" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const PROJECT = 'vyrgrxebuugqccqhgcjf';

const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => v === null || v === undefined || v === '' ? null : Number(v);
const fmt = (v, d=2) => { v = num(v); if (v === null || isNaN(v)) return '—'; return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); };
const kg = v => fmt(v,1), jd = v => fmt(v,2);
const pct = v => { v = num(v); return v === null || !isFinite(v) ? '—' : (v*100).toFixed(1)+'%'; };
const sum = (arr, k) => (arr||[]).reduce((a,r)=>a+(num(typeof k==='function'?k(r):r[k])||0),0);
// weighted average Σ(w·x)/Σw over rows with a positive weight (e.g. cost per kg weighted by kg)
const wavg = (arr, x, w) => { let a = 0, b = 0; (arr||[]).forEach(r => { const xv = num(typeof x==='function'?x(r):r[x]), wv = num(typeof w==='function'?w(r):r[w]); if (xv !== null && wv !== null && isFinite(xv) && isFinite(wv) && wv > 0) { a += xv*wv; b += wv; } }); return b ? a/b : null; };
const ratio = (arr, a, b) => { const d = sum(arr, b); return d ? sum(arr, a)/d : null; };
const by = (arr, f) => (arr||[]).reduce((m,r)=>{const k=f(r);(m[k]=m[k]||[]).push(r);return m;},{});
const dayName = d => new Date(d+'T12:00:00').toLocaleDateString('ar-JO-u-nu-latn',{weekday:'long',day:'numeric',month:'numeric'});
const vanName = v => { const x = (typeof D !== 'undefined' && D && D.vans || []).find(z=>z.van_no==v); return x ? x.name : 'السيارة '+v; };
const vanNos = () => ((typeof D !== 'undefined' && D && D.vans) || [{van_no:1},{van_no:2}]).filter(v=>v.active!==false).map(v=>v.van_no);
const vanPill = v => `<span class="pill v${v}">${vanName(v)}</span>`;
const ncls = v => num(v) < 0 ? ' neg' : '';
const iso = d => d.toISOString().slice(0,10);
const today = iso(new Date(Date.now() - new Date().getTimezoneOffset()*60000));
const METHODS = ['نقدي','تسديد ذمم سابقة','تحويل بنكي (كليك)','شيك'];
const RECEIPTS = ['نقدي','ذمم'];

function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
window.copyTable = function(id){
  const t=document.getElementById(id); if(!t) return;
  const text=[...t.rows].filter(r=>!r.classList.contains('foot-heads')).map(r=>[...r.cells].filter(c=>!c.classList.contains('noexp')).map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
  const fallback=()=>{ const r=document.createRange(); r.selectNode(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('حدِّد ثم انسخ (Ctrl+C)'); };
  try{ navigator.clipboard.writeText(text).then(()=>toast('نُسخ الجدول — الصقه في الإكسل'),fallback); }catch(e){ fallback(); }
};
const copyBtn = id => `<button class="ghost" type="button" onclick="copyTable('${id}')">نسخ للإكسل</button>`;

let mcp = null;
function lit(s){ s = String(s ?? ''); let tag; do { tag = '$q' + Math.random().toString(36).slice(2,8) + '$'; } while (s.includes(tag)); return tag + s + tag; }
// The connector answers {"result": "…<untrusted-data-…>[rows]</untrusted-data-…>…"};
// accept that in any of the shapes the viewer may hand it over.
function rowsFrom(x){
  if (x === null || x === undefined) return null;
  if (Array.isArray(x)) return x;
  if (typeof x === 'object') {
    if (typeof x.result === 'string') return rowsFrom(x.result);
    if (Array.isArray(x.result)) return x.result;
    return null;
  }
  const str = String(x);

  let parsed;
  try { parsed = JSON.parse(str); } catch(e) { parsed = undefined; }
  if (parsed !== undefined && typeof parsed !== 'string') return rowsFrom(parsed);
  // the opening tag is also named in the sentence before it, so take the LAST
  // opening tag before the closing one
  const close = str.indexOf('</untrusted-data-');
  const open = close > 0 ? str.lastIndexOf('<untrusted-data-', close) : -1;
  const m = open >= 0 ? [null, null, str.slice(str.indexOf('>', open) + 1, close)] : null;
  if (m) {
    const seg = m[2].trim();
    try { return JSON.parse(seg); } catch(e) {}
    // still JSON-escaped (the outer text was not valid JSON): unescape, then read
    try { return JSON.parse(JSON.parse('"' + seg.replace(/^(\\n)+|(\\n)+$/g, '') + '"')); } catch(e) {}
  }
  return null;
}
let lastShape = '';
function rowsOf(r){
  const cands = [r && r.payload, r && r.structuredContent, ...((r && r.content) || []).map(c => c && c.text)];
  for (const c of cands) { const rows = rowsFrom(c); if (rows) return rows; }
  try {
    const t = (r && r.content && r.content[0] && r.content[0].text) || JSON.stringify(r) || '';
    lastShape = `[${t.length} حرف${r && 'payload' in r ? '، payload=' + typeof r.payload : ''}] … ` + t.slice(-160);
  } catch(e) { lastShape = String(r).slice(0, 200); }
  return [];
}
function cleanError(e){
  const msg = String((e && (e.message || (e.result && JSON.stringify(e.result)))) || e || '');
  const m = msg.match(/ERROR:\s*(?:[A-Z0-9]{5}:\s*)?([^\n"\\]+)/);
  return (m ? m[1] : msg).replace(/\(SQLSTATE.*$/,'').trim().slice(0,300);

async function sql(text){
  if (!mcp) throw {code:'no_mcp', message:'no connection'};
  const r = await mcp.callTool(SERVER, 'execute_sql', {project_id: PROJECT, query: text}, {cache:false});
  return rowsOf(r);
}
// Big answers come back in pieces, so no reply is ever too large for the viewer.
async function sqlJson(expr){
  const CH = 24000;
  const first = await sql(`select length(t) as n, substr(t, 1, ${CH}) as c from (select (${expr})::text as t) x`);
  if (!first.length) throw {message: 'لم يصل رد من قاعدة البيانات' + (lastShape ? ' — ' + lastShape : '')};
  const n = Number(first[0].n) || 0; let text = first[0].c || '';
  const offs = []; for (let off = CH; off < n; off += CH) offs.push(off);
  // all remaining pieces in parallel: one round trip instead of one per piece
  const parts = await Promise.all(offs.map(off => sql(`select substr((${expr})::text, ${off + 1}, ${CH}) as c`)));
  for (const part of parts) text += (part[0] && part[0].c) || '';
  return text ? JSON.parse(text) : null;
}

function connectionMessage(e){
  const c = e && e.code;
  if (c === 'server_not_connected' || c === 'selection_required') return 'أضف موصل Supabase من إعدادات claude.ai ← Connectors، ثم أعد فتح الصفحة.';
  if (c === 'needs_reauth') return 'انتهت صلاحية الدخول إلى Supabase. أعد ربطه من إعدادات claude.ai ← Connectors.';
  if (c === 'not_in_manifest' || c === 'not_granted' || c === 'approval_required') return 'الصفحة تحتاج إذنك لاستخدام Supabase. افتح قائمة الأذونات للصفحة واسمح لـ Supabase، أو اضغط «أعد المحاولة».';
  if (c === 'server_unavailable' || c === 'upstream_error') return 'لم يردّ Supabase الآن. انتظر لحظة ثم اضغط «أعد المحاولة».';
  if (c === 'no_mcp' || c === 'capability_disabled' || c === 'capability_removed') return 'افتح هذه الصفحة من داخل Claude (وليس كملف منفصل) حتى تتصل بقاعدة البيانات.';
  return cleanError(e) || 'تعذّر الاتصال.';
}

let loading = false;
let loadSeq = 0;
function busy(on){ const b = $('#busy'); if (b) b.classList.toggle('on', !!on); }
async function load(){
  const seq = ++loadSeq;
  loading = true; busy(true);
  if (!D) $('#status').textContent = 'جارٍ التحميل…'; else { const st = $('#status'); if (!st.querySelector('.spin')) st.insertAdjacentHTML('afterbegin', '<span class="spin" aria-label="جارٍ التحديث"></span>'); }
  try {
    const [dd] = await Promise.all([API.day(state.day), loadMeta()]);
    if (seq !== loadSeq) return;   // a newer load already started (date changed while this one ran)
    D = dd;
    if (!D) throw {message:'لم تصل بيانات من قاعدة البيانات.'};
    $('#status').innerHTML = `${D.closed?'<span class="pill bad">اليوم مغلق</span>':''}<span>آخر تحديث ${new Date().toLocaleTimeString('ar-JO-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}</span> <button class="icon-btn" type="button" id="reload">تحديث</button>`;
    $('#reload').onclick = load;
    render();
  } catch(e) {
    $('#status').textContent = '';
    main.innerHTML = `<div class="banner bad">${esc(connectionMessage(e))}<div style="margin-top:10px"><button class="btn sec" type="button" id="retry">أعد المحاولة</button></div></div>`;
    $('#retry').onclick = load;
  } finally { if (seq === loadSeq) { loading = false; busy(false); } }
}

// ================================================================ modal forms
function openModal(html, onSubmit){
  const after = state.afterSave; state.afterSave = null;
  const m = $('#modal');
  m.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><form class="sheet" id="mform" novalidate>${html}
    <div class="err" id="merr" hidden></div>
    <div class="sheet-foot"><span class="grow muted" id="mnote"></span><span style="display:inline-flex;gap:8px"><button type="button" class="btn sec" id="mcancel">إلغاء</button><button type="submit" class="btn" id="msave">حفظ</button></span></div>
  </form></div>`;
  const close = () => { m.innerHTML = ''; };
  $('#mcancel').onclick = close;
  m.querySelector('.overlay').addEventListener('click', e => { if (e.target.classList.contains('overlay')) close(); });
  document.addEventListener('keydown', function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k);} });
  $('#mform').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#msave'), err = $('#merr');
    err.hidden = true; btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try {
      const msg = await onSubmit(new FormData($('#mform')), $('#mform'));
      close(); if (msg) toast(msg); load(); if (after) after();
    } catch(ex) {
      err.textContent = ex && ex.code && !/tool_error/.test(ex.code) ? connectionMessage(ex) : cleanError(ex);
      err.hidden = false; btn.disabled = false; btn.textContent = 'حفظ';

}

// several transfers at once: one date, a line per item/from/to
function transferLinesForm(locs){
  openModal(`<h2>تحويلات جديدة</h2>
    <div class="form-grid"><div class="field"><label for="f_day">التاريخ</label><input id="f_day" type="date" name="day" value="${esc(state.day)}"></div></div>
    <div class="tablebox"><table class="lines"><thead><tr><th>الصنف</th><th>من</th><th>الى</th><th class="n">الكمية (كغم)</th><th class="n">كلفة الكيلو</th><th></th></tr></thead><tbody id="trows"></tbody></table></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><button type="button" class="btn sec" id="addTr">+ سطر</button><span class="muted" style="font-size:.8rem" id="trcount"></span></div>
    <p class="muted" style="margin:0;font-size:.8rem">يُفتح سطر جديد تلقائياً عند تعبئة السطر الأخير. الكلفة فارغة = متوسط كلفة اليوم.</p>`,
    async (fd, form) => {
      const day = fd.get('day');
      const rows = [...form.querySelectorAll('#trows tr')].map(tr=>({item:tr.querySelector('.ti').value, from:tr.querySelector('.tf').value, to:tr.querySelector('.tt').value, qty:num(tr.querySelector('.tq').value), unit_cost:tr.querySelector('.tc').value||''}))
        .filter(r=>r.item && r.qty);
      if (!rows.length) throw {message:'ERROR: أضف سطراً واحداً على الأقل بصنف وكمية'};
      for (const r of rows) if (r.from === r.to) throw {message:`ERROR: «من» و«الى» متطابقان في سطر ${r.item}`};
      let n = 0;
      for (const r of rows) { await sql(`select office_save_transfer(${lit(JSON.stringify({day, ...r}))}::jsonb, ${lit(ACTOR)})`); n++; }
      return `حُفظ ${n} تحويل`;
    });
  const tbody = $('#trows'); const cnt = $('#trcount');
  const filled = tr => tr.querySelector('.ti').value && num(tr.querySelector('.tq').value) > 0;
  const addRow = () => {
    const last = tbody.lastElementChild;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><select class="ti" aria-label="الصنف"><option value=""></option>${itemOptions('')}</select></td><td><select class="tf" aria-label="من">${opts(locs, last?last.querySelector('.tf').value:'جمله')}</select></td><td><select class="tt" aria-label="الى">${opts(locs, last?last.querySelector('.tt').value:locs[2])}</select></td><td><input class="n tq" inputmode="decimal" aria-label="الكمية"></td><td><input class="n tc" inputmode="decimal" aria-label="كلفة الكيلو" placeholder="تلقائي"></td><td><button type="button" class="icon-btn del" aria-label="حذف السطر">✕</button></td>`;
    tr.querySelector('.del').onclick = () => { if (tbody.children.length > 1) tr.remove(); count(); };
    // when the last line is filled, open the next one
    tr.addEventListener('change', () => { if (tr === tbody.lastElementChild && filled(tr)) addRow(); count(); });
    tr.addEventListener('input', count);
    tbody.appendChild(tr);
  };
  const count = () => { const k = [...tbody.children].filter(filled).length; cnt.textContent = k ? `${k} تحويل جاهز` : ''; };
  $('#addTr').onclick = addRow;
  addRow();
}

// ---- pictures
async function shrinkImage(file, maxSide, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({message:'ERROR: الملف ليس صورة'}); i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, maxSide / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    return {b64: c.toDataURL('image/jpeg', q).split(',')[1], w, h, mime:'image/jpeg'};
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhoto(kind, ref, day, van, file){
  let im = await shrinkImage(file, 1200, 0.65);
  if (im.b64.length > 300000) im = await shrinkImage(file, 950, 0.55);
  const meta = {kind, ref_id:String(ref), day, van_no:van||'', mime:im.mime, width:im.w, height:im.h};
  await sql(`select office_attach(${lit(JSON.stringify(meta))}::jsonb, ${lit(im.b64)}, ${lit(ACTOR)})`);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
/** calls the OneDrive function through the database (pg_net) and returns its JSON */
async function exportFn(params){
  const r = await sql(`select net.http_get(url := 'https://vyrgrxebuugqccqhgcjf.supabase.co/functions/v1/onedrive-sync?' || ${lit(params)} || '&key=' || (select export_key from onedrive_link where id = 1), timeout_milliseconds := 120000) as id`);
  const id = r[0] && r[0].id; if (!id) throw {message:'ERROR: تعذّر الاتصال بخدمة النسخ'};
  for (let i = 0; i < 40; i++) {
    await sleep(i < 5 ? 800 : 1500);
    const x = await sql(`select status_code, content, error_msg from net._http_response where id = ${Number(id)}`);
    if (x[0] && (x[0].status_code || x[0].error_msg)) {
      if (x[0].error_msg) throw {message:'ERROR: ' + x[0].error_msg};
      try { return JSON.parse(x[0].content); } catch(e) { throw {message:'ERROR: رد غير مفهوم من الخدمة'}; }
    }
  }
  throw {message:'ERROR: الخدمة لم ترد في الوقت المحدد'};
}
async function exportSetup(){
  const m = $('#modal');
  m.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet" style="width:min(460px,100%)">
    <h2>ربط OneDrive</h2><div id="odBody"><p class="muted">جارٍ تجهيز رمز الربط…</p></div>
    <div class="sheet-foot"><span class="grow"></span><button type="button" class="btn sec" id="odClose">إغلاق</button></div></div></div>`;
  const close = () => { m.innerHTML = ''; stop = true; };
  let stop = false; $('#odClose').onclick = close;
  const body = $('#odBody');
  try {
    const j = await exportFn('setup=1&json=1');
    if (!j.user_code) throw {message:'ERROR: ' + (j.error || 'لم يصل رمز')};
    body.innerHTML = `<p>1) اضغط الزر وسجّل الدخول بحساب Microsoft الذي فيه مجلد «صور و مستندات الجمله».<br>2) اكتب هذا الرمز عندما يُطلب:</p>
      <div style="font-size:32px;letter-spacing:4px;font-weight:700;text-align:center;padding:14px;background:var(--bg);border-radius:10px;margin:12px 0;direction:ltr">${esc(j.user_code)}</div>
      <a class="btn" style="display:block;text-align:center" href="${esc(j.verification_uri)}" target="_blank" rel="noopener">فتح صفحة Microsoft</a>
      <p id="odSt" class="muted" style="margin-top:12px">بانتظار تسجيل الدخول… (هذه النافذة تتحقق تلقائياً)</p>`;
    while (!stop) {
      await sleep(6000); if (stop) break;
      let p; try { p = await exportFn('poll=1'); } catch(e) { continue; }
      const st = $('#odSt'); if (!st) break;
      if (p.status === 'ok') { st.className = ''; st.style.color = 'var(--good)'; st.style.fontWeight = '700'; st.textContent = `✓ تم الربط بمجلد «${p.root||''}». بدأ النسخ: ${p.sent} ملف الآن، ${p.pending} بالانتظار — يكمل تلقائياً كل 10 دقائق.`; state.exp1 = null; state.exp1Loading = false; render(); break; }
      if (p.status === 'error') { st.style.color = 'var(--bad)'; st.textContent = p.message; break; }
    }
  } catch(ex) { body.innerHTML = `<div class="banner bad">${esc(cleanError(ex))}</div>`; }
}

    <p class="muted" style="margin:0 0 8px;font-size:.86rem">لكل يوم باعت فيه سيارة صنفاً لم يكن عندها، يُسجَّل تحويل بتاريخ ذلك اليوم من السيارة التي كان الصنف عندها، بالكمية الناقصة فقط، وبكلفة ذلك اليوم — فتصبح كلفة البيع صحيحة في السيارتين. تظهر هذه التحويلات في «التحويلات» ويمكن حذفها كأي تحويل.</p>

    ${miss.length?`<p class="muted" style="margin:0 0 8px;font-size:.82rem">${miss.length} حالة (${kg(sum(miss,'qty'))} كغم) لا يمكن تحويلها: الصنف لم تشترِه أي سيارة — تُحلّ بإدخال المشتريات.</p>`:''}

function rangeOf(k){
  const t = new Date(state.day+'T12:00:00'); const d = x => iso(new Date(x.getTime() - x.getTimezoneOffset()*60000));
  const y = t.getFullYear(), m = t.getMonth();
  if (k==='today') return [state.day, state.day];
  if (k==='yesterday'){ const a=new Date(t); a.setDate(a.getDate()-1); return [d(a), d(a)]; }
  if (k==='this_week'){ const a=new Date(t); a.setDate(a.getDate()-((a.getDay()+1)%7)); return [d(a), state.day]; }   // week starts Saturday
  if (k==='this_month') return [d(new Date(y,m,1,12)), state.day];
  if (k==='last_month') return [d(new Date(y,m-1,1,12)), d(new Date(y,m,0,12))];
  if (k==='this_year') return [d(new Date(y,0,1,12)), state.day];
  return [D.first_day || state.day, state.day];
}

function cellText(v, t, row){
  if (t==='auto') t = row._t || 'jd';
  if (v===null || v===undefined || v==='') return '';
  if (t==='jd') return jd(v); if (t==='kg') return kg(v); if (t==='n3') return fmt(v,3); if (t==='n4') return fmt(v,4);
  if (t==='int') return String(Math.round(num(v))); if (t==='pct') return pct(v); if (t==='van') return vanName(v);
  return String(v);
}
const isNumT = t => ['jd','kg','n3','n4','int','pct','auto'].includes(t);
function totalsOf(tb){
  const tot = {}; tb.cols.forEach(([k,,t])=>{ if (['jd','kg','int'].includes(t) && !(tb.totalSkip||[]).includes(k)) tot[k] = sum(tb.rows, k); });
  // averages are never added up: the total row shows the true average of the whole table
  Object.entries(tb.ratio||{}).forEach(([k,[a,b]])=>{ tot[k] = ratio(tb.rows, a, b); });
  Object.entries(tb.wavg||{}).forEach(([k,w])=>{ tot[k] = wavg(tb.rows, k, w); });
  return tot;
}
const totLabel = tb => (tb.ratio||tb.wavg) ? 'الاجمالي / المتوسط' : 'الاجمالي';
function renderTable(tb, idx, secTitle){
  const id = 'rt'+idx;
  const h3 = tb.title === secTitle ? '' : `<h3>${esc(tb.title)}</h3>`;
  if (!tb.rows.length) return `<div><div class="sec-head">${h3}</div><div class="panel empty">لا بيانات في هذه الفترة.</div></div>`;
  const tot = tb.total ? totalsOf(tb) : null;
  return `<div><div class="sec-head"><div>${h3}${tb.note?`<p>${esc(tb.note)}</p>`:''}</div>${copyBtn(id)}</div>
    <div class="tablebox"><table id="${id}"><thead><tr>${tb.cols.map(([k,l,t])=>`<th class="${isNumT(t)?'n':''}">${esc(l)}</th>`).join('')}${tb.act?'<th class="noexp"></th>':''}</tr></thead><tbody>
    ${tb.rows.map(r=>`<tr>${tb.cols.map(([k,l,t])=>`<td class="${isNumT(t)?'n':''}${isNumT(t)&&num(r[k])<0?' neg':''}">${esc(cellText(r[k],t,r))}</td>`).join('')}${tb.act?`<td class="noexp keep">${tb.act(r)}</td>`:''}</tr>`).join('')}
    ${tot?`<tr class="total">${tb.cols.map(([k,,t],i)=>`<td class="${isNumT(t)?'n':''}"${(tb.ratio&&tb.ratio[k])||(tb.wavg&&tb.wavg[k])?' title="متوسط مرجّح للجدول كله"':''}>${i===0?totLabel(tb):(k in tot?esc(cellText(tot[k],t,{})):'')}</td>`).join('')}${tb.act?'<td class="noexp"></td>':''}</tr>`:''}
    </tbody></table></div></div>`;
}

function reportSheets(){
  const t = reportTitle();
  return SECTIONS.filter(s=>rep.sections.includes(s.id)).map(s=>{
    const aoa = [['شركة خيرات العز للدواجن والمجمدات'], [s.t], [t.period + ' · ' + t.vans], []];
    tablesFor(s.id, R).forEach(tb=>{
      aoa.push([tb.title]); aoa.push(tb.cols.map(c=>c[1]));
      tb.rows.forEach(r=>aoa.push(tb.cols.map(([k,,ty])=>{ const v=r[k]; const tt = ty==='auto' ? (r._t||'jd') : ty; if (v===null||v===undefined||v==='') return ''; if (tt==='van') return vanName(v); if (['jd','kg','n3','n4','int','pct'].includes(tt)) return Number(v); return String(v); })));

      aoa.push([]);
    });

// one table per branch and direction (صادر إلى / وارد من); a table only when it has lines
function transferGroups(list){
  const groups = {}, order = [];
  (list||[]).forEach(t => {
    let key, title;
    if (t.to_kind==='branch' && t.from_kind!=='branch') { key = 'out|'+t.to_name; title = 'صادر إلى '+t.to_name; }
    else if (t.from_kind==='branch' && t.to_kind!=='branch') { key = 'in|'+t.from_name; title = 'وارد من '+t.from_name; }
    else { key = 'other'; title = 'تحويلات أخرى (بين السيارات أو الفروع)'; }
    if (!groups[key]) { groups[key] = {title, rows:[]}; order.push(key); }
    groups[key].rows.push(t);
  });
  const branchOf = k => k.split('|')[1] || '~';
  order.sort((a,b) => branchOf(a).localeCompare(branchOf(b), 'ar') || (a.startsWith('out')?0:1) - (b.startsWith('out')?0:1));
  return order.map((k,i) => { const g = groups[k];
    const items = Object.entries(by(g.rows, r=>r.item)).map(([item, rs]) => ({item, qty:sum(rs,'qty'), total_cost:sum(rs,'total_cost'), n:rs.length}));

// Supabase free plan: the database may hold 500 MB. Photos are what grows; everything else is tiny.
// Green under 60%, amber under 80%, red above — the owner then purges exported photos or subscribes.
function usagePanel(u){
  if (!u) return '<div class="panel empty">جارٍ قراءة حجم قاعدة البيانات…</div>';
  if (!u.db_bytes) return '';
  const MB = b => (b/1048576).toFixed(1);
  const lim = u.limit_bytes || 524288000, pct = Math.min(100, u.db_bytes*100/lim);
  const days = u.first_photo ? Math.max(1, Math.round((Date.now()-new Date(u.first_photo+'T00:00:00'))/86400000)) : 0;
  const perDay = days ? u.photo_bytes_30d/Math.min(days,30) : 0;
  const left = lim - u.db_bytes, months = perDay ? (left/perDay/30.4) : 0;
  const level = pct>=80?'bad':pct>=60?'warn':'good';
  const color = level==='bad'?'var(--bad)':level==='warn'?'#b7791f':'var(--good)';
  const msg = level==='bad' ? 'قاعدة البيانات شبه ممتلئة — اشترك في خطة Pro ‏(25$ شهرياً) أو احذف نسخ الصور المرسلة إلى OneDrive.'
            : level==='warn' ? 'اقتربت من الحد — خطّط للاشتراك أو لتنظيف الصور خلال الأشهر القادمة.'
            : 'لا حاجة للاشتراك الآن.';
  return `<div class="panel" style="border-color:${level==='good'?'var(--line)':color}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><b>حجم قاعدة البيانات (Supabase — الخطة المجانية)</b>
        <p class="muted" style="margin:4px 0 0;font-size:.85rem">${MB(u.db_bytes)} MB من ${MB(lim)} MB (${pct.toFixed(1)}%) · الصور ${MB(u.photo_bytes)} MB لـ ${fmt(u.photos,0)} صورة${u.exported_photos!=null?` (${fmt(u.exported_photos,0)} منها منسوخة إلى OneDrive)`:''} · الفواتير ${fmt(u.invoices,0)}</p>
        <p style="margin:6px 0 0;font-size:.88rem;color:${color}"><b>${msg}</b>${perDay?` بالوتيرة الحالية (${MB(perDay)} MB يومياً، معظمها صور) يبقى نحو <b>${months>=24?'أكثر من سنتين':Math.round(months)+' شهراً'}</b> قبل الامتلاء.`:''}</p></div>
    </div>
    <div style="height:10px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden;direction:ltr"><div style="width:${pct.toFixed(1)}%;height:100%;background:${color};min-width:3px"></div></div>
  </div>`;
}

async function loadPnl(){

async function loadPnl0(Q){

      <tr>${TD('<b>الاجمالي</b>')}${TD('')}${TD('')}${TD('')}${TD('')}${TD('<b>'+kg(X.kg)+'</b>',1)}${TD('<b>'+jd(X.total)+'</b>',1)}${TD('<b>'+jd(X.cost)+'</b>',1)}${TD('<b>'+jd(X.profit)+'</b>',1)}</tr></tbody></table>
      <div style="font-weight:700;margin:14px 0 6px">حساب المتاجرة والتحصيل</div>
      <table style="font-size:12px;max-width:560px"><tbody>${TRADING_ROWS(X.trading||{}).map(r=>`<tr>${TD(esc(r[0]))}${TD(r[2]==='kg'?kg(r[1]):r[2]==='pct'?pct(r[1]):jd(r[1]),1)}</tr>`).join('')}</tbody></table></div>`;
    return saveDoc(title, inner, title + '.html');
  }
  if (typeof XLSX === 'undefined') { toast('مكتبة Excel لم تُحمَّل — تأكد من الإنترنت وأعد المحاولة'); return; }
  const dl = await window.claude?.use?.('downloads'); if (!dl) { toast('التنزيل غير متاح في هذه الشاشة'); return; }
  const wb = XLSX.utils.book_new();
  const aoa = [['التاريخ','الرقم','السيارة','العميل','النوع','كغم','المبلغ','الكلفة','الربح'], ...(X.rows||[]).map(r=>[r.day, r.number||'', vanName(r.van_no), r.customer_name, r.receipt_type, num(r.kg), num(r.total), num(r.cost), num(r.total)-num(r.cost)]), ['الاجمالي','','','','',num(X.kg),num(X.total),num(X.cost),num(X.profit)]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'المبيعات');

  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  try { await dl.save({filename: title + '.xlsx', data: new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}); } catch(e){ if (e && e.code!=='declined') toast('تعذّر التنزيل: '+(e.message||e.code)); }
}

// ================================================================ المخزون (stock page)
// Company stock for a period: opening, purchases, transfers in/out with branches, sold, closing —
// in kilos and in money — per item, per company and per van. Costs are the company's average cost.
function stockRows(X){
  const tv = {};
  (X.transfers||[]).forEach(t => { const r = tv[t.item] || (tv[t.item] = {in_qty:0,in_val:0,out_qty:0,out_val:0});
    if (t.from_kind==='branch' && t.to_kind!=='branch') { r.in_qty += num(t.qty)||0; r.in_val += num(t.total_cost)||0; }
    else if (t.to_kind==='branch' && t.from_kind!=='branch') { r.out_qty += num(t.qty)||0; r.out_val += num(t.total_cost)||0; } });
  return (X.item_movement||[]).map(m => { const t = tv[m.item] || {};
    const opening_value = (num(m.opening_qty)||0) * (num(m.opening_cost)||0);
    return {item:m.item, company:m.company, opening_qty:m.opening_qty, opening_value,
      purchased:m.purchased, purchased_value:m.purchased_value, buy_price: num(m.purchased)?m.purchased_value/m.purchased:null,
      transfer_in:m.transfer_in, in_value:t.in_val||0, transfer_out:m.transfer_out, out_value:t.out_val||0,
      sold:m.sold, cogs:m.cogs, sold_value:m.sold_value, closing_qty:m.closing_qty, closing_cost:m.closing_cost, closing_value:m.closing_value}; })
    .filter(r => [r.opening_qty,r.purchased,r.transfer_in,r.transfer_out,r.sold,r.closing_qty].some(v => Math.abs(num(v)||0) > 0.0005))
    .map((r, _, all) => {
      if (r.closing_cost !== null && r.closing_cost !== undefined) return r;
      // no purchase ever → no cost: use the average cost of the company's stock that has one
      const pick = all.filter(x => x.company===r.company && x.closing_cost != null && num(x.closing_qty) > 0);
      const base = pick.length ? pick : all.filter(x => x.closing_cost != null && num(x.closing_qty) > 0);
      const est = ratio(base, 'closing_value', 'closing_qty');
      if (est === null) return r;
      return {...r, est:true, item: r.item + ' (كلفة تقديرية)', closing_cost: est, closing_value: (num(r.closing_qty)||0)*est,
              cogs: num(r.cogs) ? r.cogs : (num(r.sold)||0)*est};
    });
}

function cfStatements(X, P){
  const R = X.receipts||{}, PU = X.purchases||{}, TR = X.transfers||{}, EX = X.expenses||{}, DP = X.deposits||{}, CB = X.cash_box||{}, SL = X.sales||{}, RC = X.receivables||{}, I = X.inventory||{}, U = X.unsettled||{};
  const n = v => num(v)||0;
  const chq = P.chequeBasis==='received' ? n(R.cheques_received) : n(R.cheques_collected);
  const receipts = n(R.cash) + n(R.bank) + chq;
  const paidSuppliers = P.purchasesCash ? n(PU.value) : 0;
  const expenses = n(EX.total);
  const direct = receipts - paidSuppliers - expenses;
  const cl = cfClosing(X, P);
  const available = n(I.opening_value) + n(PU.value) + n(TR.in) - n(TR.out);
  const cogsP = available - cl.v;
  const grossP = n(SL.total) - cogsP;
  const diffCogs = cogsP - n(SL.cogs);
  const recvOpen = n(RC.opening) + (P.chequeBasis==='received' ? 0 : n(R.cheques_pending_start));
  const recvClose = n(RC.closing) + (P.chequeBasis==='received' ? 0 : n(R.cheques_pending_end));
  const dRecv = recvClose - recvOpen, dInv = cl.v - n(I.opening_value);
  const netProfit = grossP - expenses;
  const indirect = netProfit - dRecv - dInv + (P.purchasesCash ? 0 : n(PU.value)) - (n(TR.out) - n(TR.in));
  const exCash = CB.expenses_from_cash!==undefined ? n(CB.expenses_from_cash) : n(EX.cash);
  const cashbookEnd = n(CB.opening) + n(R.cash) + n(R.cheques_received) - exCash - n(DP.total);
  const row = (k, v, t, cls) => ({k, v, _t:t||'jd', cls});
  const S = {};
  S.periodic = { rows: [
      row('مخزون أول المدة (بالكلفة)', I.opening_value), row('   الكمية (كغم)', I.opening_kg, 'kg'),
      row('+ المشتريات', PU.value), row('   الكمية (كغم)', PU.kg, 'kg'),
      row('+ وارد من الفروع (بالكلفة)', TR.in), row('− صادر للفروع (بالكلفة)', -n(TR.out)),
      row('= البضاعة المتاحة للبيع', available, 'jd', 'sub'),
      row('− مخزون آخر المدة: ' + cl.label, -cl.v),
      row('= كلفة البضاعة المباعة (بالجرد الدوري)', cogsP, 'jd', 'sub'),
      row('المبيعات', SL.total), row('   الكمية (كغم)', SL.kg, 'kg'),
      row('= مجمل الربح بالجرد الدوري', grossP, 'jd', 'total'), row('   هامش الربح', n(SL.total)?grossP/n(SL.total):null, 'pct'),
      row('للمقارنة: كلفة المبيعات بالجرد المستمر (صنفاً صنفاً)', SL.cogs), row('للمقارنة: مجمل الربح بالجرد المستمر', SL.gross),
      row(diffCogs>=0?'الفرق: كلفة لم يفسّرها الجرد المستمر (عجز أو مشتريات/تحويلات لم تُدخل أو أسعار كلفة)':'الفرق: بضاعة أكثر مما يقوله الجرد المستمر (فائض أو مبيعات لم تُدخل)', diffCogs, 'jd', Math.abs(diffCogs)>1?'warn':''),
      ...(n(U.profit_overstated)?[row('   منها غير مسوّى: مبيعات أصناف بلا كلفة (تقدير)', U.profit_overstated)]:[]),
    ], closing: cl, cogsP, grossP, diffCogs };
  S.direct = { rows: [
      row('المقبوضات من العملاء', receipts, 'jd', 'sub'),
      row('   نقداً وسندات', R.cash), row('   كليك / تحويل بنكي', R.bank),
      row(P.chequeBasis==='received' ? '   شيكات مستلمة (تُعدّ نقداً عند الاستلام)' : '   شيكات محصّلة في الفترة (' + n(R.cheques_collected_n) + ')', chq),
      ...(P.chequeBasis==='received'?[]:[row('   (شيكات مستلمة ولم تُحصّل بعد — ليست نقداً)', R.cheques_pending_end)]),
      row(P.purchasesCash ? '− المدفوعات للموردين (المشتريات، بافتراض الدفع عند الشراء)' : '− المدفوعات للموردين (غير مسجّلة — المشتريات آجلة)', -paidSuppliers),
      row('− المصاريف المدفوعة', -expenses), row('   نقدي', EX.cash), row('   بنكي / كليك', EX.bank), row('   شيكات', EX.cheque),
      row('= صافي التدفق النقدي من الأنشطة التشغيلية', direct, 'jd', 'total'),
      row('أنشطة استثمارية وتمويلية (شراء معدات، سحوبات ورأس مال، قروض): غير مسجّلة في النظام', null, 'text'),
      row('للعلم: بضاعة حُوّلت للفروع بالكلفة — ليست نقداً', TR.out),
    ], value: direct };
  S.indirect = { rows: [
      row('مجمل الربح بالجرد الدوري', grossP), row('− المصاريف', -expenses), row('= صافي الربح', netProfit, 'jd', 'sub'),
      row((dRecv>=0?'− زيادة':'+ نقص') + ' الذمم على العملاء' + (P.chequeBasis==='received'?'':' (مع الشيكات غير المحصلة)'), -dRecv),
      row((dInv>=0?'− زيادة':'+ نقص') + ' المخزون (بالكلفة)', -dInv),
      ...(P.purchasesCash?[]:[row('+ مشتريات آجلة لم تُدفع (ذمم للموردين)', PU.value)]),
      row('− صادر للفروع بالكلفة + وارد منها (نقص في المخزون بلا نقد)', -(n(TR.out) - n(TR.in))),
      row('= صافي التدفق النقدي من الأنشطة التشغيلية', indirect, 'jd', 'total'),
      row('المباشرة أعطت', direct), row(Math.abs(indirect-direct)>1?'فرق بين الطريقتين (فروق تقييم أو غير مسوّى)':'الطريقتان متفقتان ✓', indirect-direct, 'jd', Math.abs(indirect-direct)>1?'warn':''),
    ], value: indirect };
  S.cashbook = { rows: [
      row('رصيد أول المدة خارج البنك (غير مودع)', CB.opening),
      row('+ مقبوضات نقدية وسندات', R.cash), row('+ شيكات مستلمة', R.cheques_received),
      row(exCash<n(EX.cash)-0.005?'− مصاريف دُفعت من نقد السيارات':'− مصاريف نقدية', -exCash), row('− إيداعات نقدية', -n(DP.cash)), row('− إيداعات شيكات', -n(DP.cheque)),
      row('= ما يجب أن يكون خارج البنك آخر المدة', cashbookEnd, 'jd', 'total'),
      row('ما تقوله اللوحة الآن (غير مودع)', CB.closing), row('   منه نقد', CB.closing_cash), row('   منه شيكات', CB.closing_cheques),
      row(Math.abs(cashbookEnd-n(CB.closing))>1?'فرق يحتاج تفسيراً':'متطابق ✓', cashbookEnd-n(CB.closing), 'jd', Math.abs(cashbookEnd-n(CB.closing))>1?'warn':''),
      row('أودع في البنك خلال المدة', DP.total),
    ], value: cashbookEnd };
  return S;
}

function alignHeads(root){
  (root||document).querySelectorAll('table').forEach(t=>{
    const hr=t.tHead&&t.tHead.rows[t.tHead.rows.length-1]; if(!hr) return;
    const hs=[...hr.cells]; if(hs.some(h=>h.colSpan>1)) return;
    const rows=[...t.tBodies].flatMap(b=>[...b.rows]).concat(t.tFoot?[...t.tFoot.rows]:[]).filter(r=>r.cells.length===hs.length);
    if(!rows.length) return;
    hs.forEach((h,i)=>{ let num=0,tot=0; for(const r of rows){ const c=r.cells[i]; if(!c.textContent.trim()) continue; tot++; if(c.classList.contains('n')||c.classList.contains('num')) num++; }
      if(tot) h.classList.toggle('n', num*2>tot); });
  });
}

  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify(args||{})});
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
  if (!r.ok) {
    const msg = String((j && (j.message || j.hint)) || t || r.statusText);
    if (/SESSION_ENDED/.test(msg)) { signOut(); }
    throw {message:'ERROR: ' + msg.replace('SESSION_ENDED: ','')};
  }
  return j;
}

};
// saves: the dashboard writes "select office_xxx(<literals>) [->>'k'] [as a]"; read the literals back and
// send them to viewer_exec, which decides (page rights, vans, days) and calls the same function.
function parseCall(st){
  const m = st.trim().match(/^select\s+([a-z_]+)\(([\s\S]*)\)\s*(?:->>'(\w+)')?\s*(?:as\s+(\w+))?\s*$/i);
  if (!m) return null;
  const src = m[2], args = []; let i = 0;
  const ws = () => { while (i < src.length && /\s/.test(src[i])) i++; };
  while (true) {
    ws(); if (i >= src.length) break;
    let val;
    const dq = src.slice(i).match(/^(\$q[a-z0-9]*\$)/);
    if (dq) { const tag = dq[1], end = src.indexOf(tag, i + tag.length); if (end < 0) return null; val = src.slice(i + tag.length, end); i = end + tag.length; }
    else if (src[i] === "'") { let j = i + 1, out = ''; while (j < src.length) { if (src[j] === "'") { if (src[j+1] === "'") { out += "'"; j += 2; continue; } break; } out += src[j++]; } val = out; i = j + 1; }
    else { const w = src.slice(i).match(/^(-?[0-9.]+|null|true|false)/i); if (!w) return null; val = /^null$/i.test(w[1]) ? null : w[1]; i += w[1].length; }
    const cast = src.slice(i).match(/^::[a-z_]+(\[\])?/i); if (cast) i += cast[0].length;
    args.push(val); ws();
    if (i < src.length) { if (src[i] !== ',') return null; i++; }
  }
  return {fn: m[1], args, key: m[3], alias: m[4]};
}
sql = async text => {
  let rows = [];
  for (const st of String(text).split(/;\s*\n/)) {
    if (!st.trim()) continue;
    const c = parseCall(st);
    if (!c) throw {message:'ERROR: هذه العملية غير متاحة في صفحة المدراء'};
    const r = await rpc('viewer_exec', {...tk(), p_fn: c.fn, p_args: c.args});
    const v = c.key ? (r && typeof r === 'object' && r[c.key] != null ? String(r[c.key]) : null) : r;
    rows = [{[c.alias || c.fn]: v}];
  }
  return rows;
};
// downloads straight to the browser (Excel, printable reports, statements, photos)
window.claude = {use: async n => n === 'downloads' ? {save: async ({filename, data}) => {
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.html$/.test(filename) ? 'text/html;charset=utf-8' : 'application/octet-stream'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}} : null};
function signOut(){
  if (TOK) rpc('viewer_logout', {p_token:TOK}).catch(()=>{});
  TOK = null; try { localStorage.removeItem('kv_view_token'); localStorage.removeItem('kv_view_name'); localStorage.removeItem('kv_view_tabs'); localStorage.removeItem('kv_view_edit'); } catch(e) {}
  showLogin();
}
function showLogin(msg){
  let el = document.getElementById('login');
  if (!el) { el = document.createElement('div'); el.id = 'login'; el.setAttribute('dir','rtl'); document.body.appendChild(el); }
  el.innerHTML = `<form id="lform"><div style="display:flex;align-items:center;gap:10px"><img src="${LOGO}" alt="" width="46" height="47"><div><b style="font-family:var(--display);font-size:1.1rem">خيرات العز</b><div class="muted" style="font-size:.8rem">لوحة العرض للمدراء</div></div></div>
    <div class="field"><label for="lu">اسم الدخول</label><input id="lu" name="u" dir="ltr" autocomplete="username" required></div>
    <div class="field"><label for="lp">كلمة المرور</label><input id="lp" name="p" type="password" dir="ltr" autocomplete="current-password" required></div>
    <div class="err" id="lerr" ${msg?'':'hidden'}>${esc(msg||'')}</div><button class="btn" type="submit" id="lbtn">دخول</button></form>`;
  el.hidden = false;
  $('#lform').addEventListener('submit', async e => {
    e.preventDefault(); const b = $('#lbtn'); b.disabled = true; b.textContent = 'جارٍ الدخول…';
    try {
      const r = await rpc('viewer_login', {p_username:$('#lu').value, p_password:$('#lp').value});
      if (!r || r.error) throw {message:'ERROR: ' + ((r && r.error) || 'تعذّر الدخول')};
      TOK = r.token; try { localStorage.setItem('kv_view_token', TOK); localStorage.setItem('kv_view_name', r.name || ''); localStorage.setItem('kv_view_tabs', JSON.stringify(r.tabs||[])); localStorage.setItem('kv_view_edit', JSON.stringify(r.edit_tabs||[])); } catch(e2) {}
      applyTabs(r.tabs, r.edit_tabs);
      el.hidden = true; startView();
    } catch(ex) { $('#lerr').textContent = cleanError(ex); $('#lerr').hidden = false; b.disabled = false; b.textContent = 'دخول'; }
  });
  $('#lu').focus();
}
window.VTABS = []; window.VEDIT = [];
function applyTabs(t, ed){
  window.VTABS = Array.isArray(t) ? t.filter(k => VIEWS[k]) : [];
  window.VEDIT = Array.isArray(ed) ? ed.filter(k => VIEWS[k]) : [];
  const sub = document.getElementById('subtitle');
  if (sub) sub.textContent = VEDIT.length ? 'تضيف وتعدّل في: ' + VEDIT.map(k => (document.querySelector('#tabs a[href="#'+k+'"]')||{}).textContent || k).join('، ') + ' · الباقي للعرض فقط' : 'للعرض فقط · الأرقام مباشرة من قاعدة البيانات';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('can-edit', VEDIT.includes(a.getAttribute('href').slice(1))));
  document.querySelectorAll('#tabs a').forEach(a => { const k = a.getAttribute('href').slice(1); a.hidden = VTABS.length > 0 && !VTABS.includes(k); });
  if (VTABS.length && !VTABS.includes(location.hash.slice(1))) location.hash = '#' + VTABS[0];
}
function startView(){
  let nm = '', tb = [], ed = []; try { nm = localStorage.getItem('kv_view_name') || ''; tb = JSON.parse(localStorage.getItem('kv_view_tabs') || '[]'); ed = JSON.parse(localStorage.getItem('kv_view_edit') || '[]'); } catch(e) {}
  $('#who').textContent = nm; $('#logoutBtn').hidden = false; $('#logoutBtn').onclick = signOut;
  applyTabs(tb, ed);
  // the owner may have changed this manager's pages since the last visit
  rpc('viewer_me', tk()).then(m => { if (m && m.tabs !== undefined) { applyTabs(m.tabs, m.edit_tabs); try { localStorage.setItem('kv_view_tabs', JSON.stringify(m.tabs||[])); localStorage.setItem('kv_view_edit', JSON.stringify(m.edit_tabs||[])); } catch(e) {} render(); } }).catch(()=>{});
  load();
}
if (TOK) startView(); else showLogin();
})();
